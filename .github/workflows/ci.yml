name: CI
# `verify` is the required check (CLAUDE.md rules 4-5). After it passes on main, `deploy-web` publishes the web app (if the Vercel secrets exist).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  # On main a running CI is never cancelled by a newer push (runs stay serialized and every main commit gets a verdict); pull requests cancel superseded runs.
  cancel-in-progress: ${{ github.event_name != 'push' }}
permissions:
  contents: read
jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: wasm32-unknown-unknown, components: 'rustfmt, clippy' }
      - uses: Swatinem/rust-cache@v2
      - name: wasm-bindgen CLI (version pinned in crates/wasm/Cargo.toml; cached)
        id: wbg
        run: echo "v=$(grep -oP 'wasm-bindgen\s*=\s*"=?\K[0-9.]+' crates/wasm/Cargo.toml | head -1)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        id: wbgcache
        with:
          path: ~/.cargo/bin/wasm-bindgen
          key: wasm-bindgen-${{ runner.os }}-${{ steps.wbg.outputs.v }}
      - if: steps.wbgcache.outputs.cache-hit != 'true'
        run: cargo install wasm-bindgen-cli --version ${{ steps.wbg.outputs.v }} --locked
      - run: npm ci --no-audit --no-fund
      - name: Lint (TypeScript, architecture boundaries, rules sync, rustfmt, clippy)
        run: npm run lint
      - run: npm run typecheck
      - name: Unit tests (TypeScript and Rust)
        run: npm test
      - name: Build (WebAssembly engine + web app)
        run: npm run build
      - name: Playwright version (the browser cache key)
        id: pwv
        run: echo "v=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        id: pw
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-${{ steps.pwv.outputs.v }}
      - name: Install browser
        run: |
          for i in 1 2 3; do
            if [ "${{ steps.pw.outputs.cache-hit }}" = "true" ]; then npx playwright install-deps chromium && break; else npx playwright install --with-deps chromium && break; fi
            [ "$i" = 3 ] && exit 1
            echo "::warning::browser install failed (try $i), retrying in 30s"; sleep 30
          done
      - name: Smoke test (desktop and phone viewports)
        run: npm run smoke
      - uses: actions/upload-artifact@v4
        with: { name: web-dist, path: apps/web/dist, retention-days: 2 }
      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with: { name: playwright-report, path: playwright-report, if-no-files-found: ignore }

  deploy-web:
    name: deploy-web
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 2 }
      # Step names are read by scripts/deploy-board-core.mjs (deployOutcome) to tell the deploy board what happened: keep them.
      - name: Does this commit change the shipped app?
        id: changed
        run: |
          if git diff --name-only HEAD^ HEAD | grep -qvE '^(docs/|process/|\.claude/|\.github/|.*\.md$)'; then echo "yes=true" >> "$GITHUB_OUTPUT"; else echo "yes=false" >> "$GITHUB_OUTPUT"; fi
      - name: 'Skipped: no app change'
        if: steps.changed.outputs.yes != 'true'
        run: 'echo "docs/process only, not deploying"'
      - name: 'Idle: VERCEL_TOKEN missing'
        if: steps.changed.outputs.yes == 'true' && env.VERCEL_TOKEN == ''
        run: 'echo "::warning::VERCEL_TOKEN secret missing, web deploy is idle (see DEPLOYING.md)"'
      - if: steps.changed.outputs.yes == 'true' && env.VERCEL_TOKEN != ''
        uses: actions/download-artifact@v4
        with: { name: web-dist, path: apps/web/dist }
      - name: Deploy to Vercel
        if: steps.changed.outputs.yes == 'true' && env.VERCEL_TOKEN != ''
        run: |
          node scripts/vercel-output.mjs
          npx --yes vercel@66 deploy --prebuilt --prod --token "$VERCEL_TOKEN"
