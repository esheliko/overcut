name: CI
# `verify` is the required check (CLAUDE.md rules 4-5). After it passes on main, `deploy-web` publishes the web app (if the Vercel secrets exist).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  # On main a running CI is never cancelled by a newer push (runs stay serialized and every main commit gets a verdict); pull requests cancel superseded runs.
  cancel-in-progress: ${{ github.event_name != 'push' }}
permissions:
  contents: read
jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: wasm32-unknown-unknown, components: 'rustfmt, clippy' }
      - uses: Swatinem/rust-cache@v2
      - name: wasm-bindgen CLI (version pinned in crates/wasm/Cargo.toml; cached)
        id: wbg
        run: echo "v=$(grep -oP 'wasm-bindgen\s*=\s*"=?\K[0-9.]+' crates/wasm/Cargo.toml | head -1)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        id: wbgcache
        with:
          path: ~/.cargo/bin/wasm-bindgen
          key: wasm-bindgen-${{ runner.os }}-${{ steps.wbg.outputs.v }}
      - if: steps.wbgcache.outputs.cache-hit != 'true'
        run: cargo install wasm-bindgen-cli --version ${{ steps.wbg.outputs.v }} --locked
      - name: Software GPU adapter (the render golden tests skip without one)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq mesa-vulkan-drivers libgl1-mesa-dri libegl1
      - run: npm ci --no-audit --no-fund
      - name: Lint (TypeScript, architecture boundaries, rules sync, rustfmt, clippy)
        run: npm run lint
      - run: npm run typecheck
      - name: Unit tests (TypeScript and Rust)
        run: npm test
      - name: Build (WebAssembly engine + web app)
        run: npm run build
      - name: Playwright version (the browser cache key)
        id: pwv
        run: echo "v=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        id: pw
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-${{ steps.pwv.outputs.v }}
      - name: Install browser
        run: |
          for i in 1 2 3; do
            if [ "${{ steps.pw.outputs.cache-hit }}" = "true" ]; then npx playwright install-deps chromium && break; else npx playwright install --with-deps chromium && break; fi
            [ "$i" = 3 ] && exit 1
            echo "::warning::browser install failed (try $i), retrying in 30s"; sleep 30
          done
      - name: Smoke test (desktop and phone viewports)
        run: npm run smoke
      - uses: actions/upload-artifact@v4
        with: { name: web-dist, path: apps/web/dist, retention-days: 2 }
      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with: { name: playwright-report, path: playwright-report, if-no-files-found: ignore }

  # Non-blocking (M1 exit criterion "budgets measured in CI", issue #51): not required by deploy-web. Numbers are runner numbers; refresh
  # tests/perf/baseline.json from this job's `perf-results` artifact (docs/PERFORMANCE.md, "Refreshing the baseline").
  perf:
    name: perf
    needs: verify
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: npm ci --no-audit --no-fund
      - uses: actions/download-artifact@v4
        with: { name: web-dist, path: apps/web/dist }
      - name: Install browser
        run: npx playwright install --with-deps chromium
      - name: Measure
        run: npm run perf -- --no-build --out perf-results.json
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: perf-results, path: perf-results.json, retention-days: 30, if-no-files-found: ignore }
      - name: Compare with tests/perf/baseline.json (warn +10%, fail +25%; job summary)
        run: |
          set -o pipefail
          { echo '### perf vs baseline'; echo '```'; node tests/perf/compare.mjs perf-results.json tests/perf/baseline.json; echo '```'; } 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"

  # Non-blocking: short time-boxed cargo-fuzz run per target (nightly). A crash uploads its artifact; nothing requires the job.
  fuzz:
    name: fuzz
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { crate: media, target: demux, seed: 'cp tests/fixtures/*.mp4 tests/fixtures/*.mov tests/fixtures/*.webm fuzz/corpus/demux/' }
          - { crate: model, target: project_file, seed: 'true' }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: 'crates/${{ matrix.crate }}/fuzz' }
      - uses: actions/cache@v4
        id: cf
        with:
          path: ~/.cargo/bin/cargo-fuzz
          key: cargo-fuzz-${{ runner.os }}-0.12
      - if: steps.cf.outputs.cache-hit != 'true'
        run: cargo install cargo-fuzz --version '^0.12' --locked
      - name: Fuzz ${{ matrix.target }} (60 s)
        working-directory: crates/${{ matrix.crate }}
        run: |
          mkdir -p fuzz/corpus/${{ matrix.target }}
          ${{ matrix.seed }}
          cargo +nightly fuzz run ${{ matrix.target }} -- -max_total_time=60 -rss_limit_mb=2048
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: 'fuzz-${{ matrix.target }}', path: 'crates/${{ matrix.crate }}/fuzz/artifacts', if-no-files-found: ignore }

  deploy-web:
    name: deploy-web
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 2 }
      - name: Does this commit change the shipped app?
        id: changed
        run: |
          if git diff --name-only HEAD^ HEAD | grep -qvE '^(docs/|process/|\.claude/|\.github/|.*\.md$)'; then echo "yes=true" >> "$GITHUB_OUTPUT"; else echo "yes=false" >> "$GITHUB_OUTPUT"; fi
      - name: 'Skipped: no app change'
        if: steps.changed.outputs.yes != 'true'
        run: 'echo "docs/process only, not deploying"'
      - name: 'Idle: VERCEL_TOKEN missing'
        if: steps.changed.outputs.yes == 'true' && env.VERCEL_TOKEN == ''
        run: 'echo "::warning::VERCEL_TOKEN secret missing, web deploy is idle (see DEPLOYING.md)"'
      - if: steps.changed.outputs.yes == 'true' && env.VERCEL_TOKEN != ''
        uses: actions/download-artifact@v4
        with: { name: web-dist, path: apps/web/dist }
      - name: Deploy to Vercel
        if: steps.changed.outputs.yes == 'true' && env.VERCEL_TOKEN != ''
        run: |
          node scripts/vercel-output.mjs
          npx --yes vercel@66 deploy --prebuilt --prod --token "$VERCEL_TOKEN"
