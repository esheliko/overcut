# Rust workspace: the engine. Everything that is not UI lives here and is shared by the web build (WASM) and the native apps (Tauri).
# apps/desktop/src-tauri is deliberately NOT a member: it needs system webview libraries, so it has its own workspace and its own CI job.
[workspace]
resolver = "2"
members = ["crates/*"]
exclude = ["apps/desktop/src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
