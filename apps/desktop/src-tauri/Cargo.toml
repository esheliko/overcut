# Own workspace on purpose: building this crate needs the platform webview libraries (see RELEASING.md), the main workspace must not.
[workspace]

[package]
name = "app-desktop"
description = "OverCut native shell (Tauri 2): hosts apps/web and exposes the Rust engine to it through commands."
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
publish = false
license = "GPL-3.0-or-later"

[lib]
name = "app_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
app-audio = { path = "../../../crates/audio" }
app-core = { path = "../../../crates/core" }
app-model = { path = "../../../crates/model" }
app-timeline = { path = "../../../crates/timeline" }
app-store = { path = "../../../crates/store" }
# libav decode + H.264/AAC encode (needs the libav development files: `apps/desktop/native-media`). Off by default so `verify` and the plain shell build without them.
app-native-media = { path = "../native-media", optional = true }
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }

[features]
native-media = ["dep:app-native-media", "dep:serde", "dep:serde_json"]

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
