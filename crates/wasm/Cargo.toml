[package]
name = "app-wasm"
description = "WebAssembly build of the engine for browsers (wasm-bindgen). Thin: every function forwards to app-core."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[lints]
workspace = true

[dependencies]
app-core = { path = "../core" }
app-media = { path = "../media" }
app-model = { path = "../model" }
app-timeline = { path = "../timeline" }
wasm-bindgen = "=0.2.130"
wasm-bindgen-futures = "=0.4.80"
js-sys = "=0.3.107"
serde_json = "1"

