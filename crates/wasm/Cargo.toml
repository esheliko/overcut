[package]
name = "app-wasm"
description = "WebAssembly build of the engine for browsers (wasm-bindgen). Thin: every function forwards to app-core."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[lints]
workspace = true

[dependencies]
app-audio = { path = "../audio" }
app-core = { path = "../core" }
app-media = { path = "../media" }
app-model = { path = "../model" }
app-timeline = { path = "../timeline" }
wasm-bindgen = "=0.2.130"
wasm-bindgen-futures = "=0.4.80"
js-sys = "=0.3.107"
serde_json = "1"


[features]
# `render`: the GPU compositor binding (src/render.rs; surfaces on an OffscreenCanvas, WebCodecs frame import). It adds ~2.5 MB of wgpu code, so
# `scripts/build-wasm.mjs` builds the package twice: without it for the UI thread, with it for the Workers that composite (ADR 0003).
render = ["dep:app-render", "dep:wgpu", "dep:web-sys"]

[target.'cfg(target_arch = "wasm32")'.dependencies]
app-render = { path = "../render", optional = true }
wgpu = { version = "26.0.1", default-features = false, features = ["wgsl", "webgpu", "webgl"], optional = true }
web-sys = { version = "=0.3.107", features = ["OffscreenCanvas", "ImageBitmap", "VideoFrame", "console"], optional = true }
